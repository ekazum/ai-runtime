[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-runtime"
version = "0.4.0"
description = "Threads, queues, pipelines, stores, checkpoints and configs for ML pipelines"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []
authors = [{ name = "Eli Kazum", email = "ekazum@gmail.com" }]
keywords = ["machine-learning", "threading", "batching", "gpu", "inference", "pipeline", "sqlite", "checkpoint"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
torch = ["torch"]
config = ["pydantic>=2", "pyyaml"]

[project.urls]
Homepage = "https://github.com/ekazum/ai-runtime"
Repository = "https://github.com/ekazum/ai-runtime"
Issues = "https://github.com/ekazum/ai-runtime/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_runtime*"]
